<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra - Repuestos S.D.S.</title>
    <link rel="stylesheet" href="compra.css">
</head>

<body>

<header>
    <h1>Repuestos <span>S.D.S.</span></h1>
</header>

<main class="compra">

    <div class="pasos">
        <div class="paso activo">1<br><small>Datos del cliente</small></div>
        <div class="linea"></div>
        <div class="paso">2<br><small>Pago</small></div>
        <div class="linea"></div>
        <div class="paso">3<br><small>Confirmación</small></div>
    </div>

    <section class="formulario">

        <h2>Datos del cliente</h2>

        <label>Nombre completo</label>
        <input type="text" placeholder="Ej: Juan Pérez">

        <label>Correo electrónico</label>
        <input type="email" placeholder="correo@ejemplo.com">

        <label>Teléfono</label>
        <input type="tel" placeholder="300 123 4567">

        <label>Dirección de entrega</label>
        <input type="text" placeholder="Calle 123 #45-67">

        <h2>Tipo de entrega</h2>

        <div class="opciones">
            <button>🚚 Envío a domicilio</button>
            <button>🏪 Recoger en tienda</button>
        </div>

        <h2>Método de pago</h2>

        <div class="opciones">
            <button>💳 Tarjeta</button>
            <button>🏦 Transferencia</button>
            <button>💵 Contra entrega</button>
        </div>

        <div class="total">
            <p>Total de la compra</p>
            <strong>$198.000</strong>
        </div>

        <button class="comprar">REALIZAR COMPRA</button>

       

    </section>
                 <tr>
                    <td colspan="2">

                        <li><a href="web sena .html">VOLVER</a></li>

                    </td>
                </tr>
</main>

</body>
</html>
